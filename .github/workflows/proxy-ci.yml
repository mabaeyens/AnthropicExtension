name: proxy-ci

# Lint + unit/integration tests for the hardened proxy. Path-filtered so it only runs
# when proxy/** (or this workflow) changes. The load/drain harness (test/load-test.js)
# is NOT run here — it's invoked on demand via `npm run load` to avoid CI flakiness.
on:
  push:
    paths:
      - 'proxy/**'
      - '.github/workflows/proxy-ci.yml'
  pull_request:
    paths:
      - 'proxy/**'
      - '.github/workflows/proxy-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
